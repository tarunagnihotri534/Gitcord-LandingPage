<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./GITCORD%20Logo.png" />
    <link rel="icon" type="image/svg+xml" href="./brand/gitcord/favicon.svg" />
    <link rel="apple-touch-icon" href="./GITCORD%20Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('gitcord-theme');
          if (t === 'light' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)) {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Primary Meta Tags -->
    <title>Gitcord — Discord-GitHub Automation Engine | AOSSIE</title>
    <meta name="title" content="Gitcord — Discord-GitHub Automation Engine | AOSSIE" />
    <meta
      name="description"
      content="A local-first, offline-first automation engine that reads GitHub activity and Discord state, then plans role changes and GitHub assignments in a deterministic, reviewable way."
    />
    <meta name="keywords" content="Gitcord, AOSSIE, Discord GitHub Bot, GitHub Automation, Discord Automation, Open Source, GSoC 2026, Role Automation, Contributor Metrics" />
    <meta name="author" content="AOSSIE" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://github.com/AOSSIE-Org/Gitcord-GithubDiscordBot" />
    <meta property="og:title" content="Gitcord — Discord-GitHub Automation Engine | AOSSIE" />
    <meta
      property="og:description"
      content="A local-first, offline-first automation engine that reads GitHub activity and Discord state, then plans role changes and GitHub assignments in a deterministic, reviewable way."
    />
    <meta property="og:image" content="./brand/gitcord-og.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@aossie_org" />
    <meta name="twitter:creator" content="@aossie_org" />
    <meta name="twitter:title" content="Gitcord — Discord-GitHub Automation Engine | AOSSIE" />
    <meta
      name="twitter:description"
      content="A local-first, offline-first automation engine that reads GitHub activity and Discord state, then plans role changes and GitHub assignments in a deterministic, reviewable way."
    />
    <meta name="twitter:image" content="./brand/gitcord-og.png" />

    <!-- Preconnect to Google Fonts for Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-gitcord-dark text-gitcord-text antialiased selection:bg-gitcord-blurple selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
